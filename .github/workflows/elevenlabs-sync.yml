name: ElevenLabs Agent Knowledge Base Sync

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.mdx"
      - "docs.json"
      - ".github/scripts/elevenlabs-sync.mjs"
      - ".github/workflows/elevenlabs-sync.yml"
  workflow_dispatch:
    inputs:
      prune_unmanaged:
        description: "Detach all knowledge base entries from the agent that were not uploaded by this workflow (e.g. the old documentation)"
        required: false
        default: false
        type: boolean

# Never run two syncs against the same agent at the same time
concurrency:
  group: elevenlabs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync docs to ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
          RUN_ID: ${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          node .github/scripts/elevenlabs-sync.mjs ${{ inputs.prune_unmanaged && '--prune-unmanaged' || '' }}
